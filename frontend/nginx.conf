server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handles all requests under /clinic/
    location /clinic/ {
        try_files $uri $uri/ /clinic/index.html;
    }

    # Redirect root of container to /clinic/
    location = / {
        return 302 /clinic/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}